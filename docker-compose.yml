services:
  fclash-sync:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Bind to loopback and let the reverse proxy terminate TLS, or change to
      # 8780:8780 only while testing.
      - "127.0.0.1:8780:8780"
    volumes:
      - fclash-data:/data

volumes:
  fclash-data:
